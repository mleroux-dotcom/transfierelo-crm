<!-- Formulario de contacto de transfiereloo.cl conectado al CRM.
     Pegalo en un bloque "HTML personalizado" (WordPress), "Insertar código" (Wix)
     o directamente en el HTML de la página. Cada envío crea un contacto "lead"
     y una tarea "Contactar a ..." en el CRM. -->
<form id="crm-form" class="crm-form" action="https://crm.transfiereloo.cl/api/public/lead" method="POST">
  <label>Nombre *<input name="nombre" required maxlength="120" autocomplete="name"></label>
  <label>Email<input name="email" type="email" maxlength="200" autocomplete="email"></label>
  <label>Teléfono / WhatsApp<input name="telefono" type="tel" maxlength="40" autocomplete="tel"></label>
  <label>Mensaje<textarea name="mensaje" rows="4" maxlength="4000"></textarea></label>
  <!-- Campo trampa para bots: no lo borres -->
  <input name="sitio_web" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <input type="hidden" name="origen" value="transfiereloo.cl">
  <button type="submit">Enviar</button>
  <p class="crm-msg" role="status"></p>
</form>
<style>
  .crm-form { display: grid; gap: 12px; max-width: 480px; font: inherit; }
  .crm-form label { display: grid; gap: 4px; font-size: 14px; }
  .crm-form input, .crm-form textarea { font: inherit; padding: 10px; border: 1px solid #c9ced6; border-radius: 6px; }
  .crm-form button { font: inherit; padding: 11px 18px; border: 0; border-radius: 6px; background: #2f6fde; color: #fff; cursor: pointer; }
  .crm-form button:disabled { opacity: .6; }
  .crm-form .crm-msg { margin: 0; min-height: 1.2em; }
</style>
<script>
  (function () {
    var form = document.getElementById("crm-form");
    var msg = form.querySelector(".crm-msg");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!form.email.value && !form.telefono.value) { msg.textContent = "D\u00e9janos un email o un tel\u00e9fono."; return; }
      var btn = form.querySelector("button");
      btn.disabled = true; msg.textContent = "Enviando\u2026";
      var data = {};
      new FormData(form).forEach(function (v, k) { data[k] = v; });
      fetch(form.action, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); }); })
        .then(function () { form.reset(); msg.textContent = "\u00a1Gracias! Te contactaremos muy pronto."; })
        .catch(function (err) { msg.textContent = (err && err.message) || "No se pudo enviar. Int\u00e9ntalo de nuevo."; })
        .finally(function () { btn.disabled = false; });
    });
  })();
</script>
